# Automated review on every pull request.
#
# The history this replaces: Codex reviewed PR #3, found four real P2 bugs, and
# never ran again. The nineteen PRs after it merged with no review of any kind,
# and nothing anywhere said so — the absence looked exactly like a clean review.
# This workflow is built so that cannot repeat: when the review cannot run, the
# check goes red and names the reason, instead of staying quiet.
#
# One secret is required, CLAUDE_CODE_OAUTH_TOKEN, generated locally with
# `claude setup-token` and pasted into Settings → Secrets and variables →
# Actions. With a Claude API key instead, swap the input below for
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`. The Claude GitHub App
# (github.com/apps/claude) must also be installed on the repository — that is
# the identity the review posts its inline comments as.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    # A review that has not finished in twenty minutes is not going to arrive
    # inside any merge window this repo actually uses.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Fail loudly, first, before anything else runs. A missing credential is
      # the one failure mode that used to be invisible.
      - name: Require the review credential
        env:
          REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$REVIEW_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN secret, so no review ran on this PR. Generate one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions. See docs/pr-review-process.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment puts the findings on the PR as inline comments. Without
          # it they go to the run log, where nobody reads them.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Keep this line even though the skill declares the same tool: the
          # action only starts the inline-comment MCP server when --allowedTools
          # names it here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
