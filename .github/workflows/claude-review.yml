# Automated review on every pull request.
#
# The history this replaces: Codex reviewed PR #3, found four real P2 bugs, and
# never ran again. The nineteen PRs after it merged with no review of any kind.
# Codex even said so on each one — "You have reached your Codex usage limits" —
# but a PR comment gates nothing, and every one of those PRs merged anyway.
# This workflow is built so that cannot repeat: when the review cannot run, the
# check goes red and names the reason, instead of staying quiet. That covers the
# action exiting green without reviewing anything, which it does whenever a PR
# changes this file — see "Confirm a review actually ran".
#
# Green means one thing: the head commit has a summary comment from the
# reviewer that names it. Until 2026-09-16 green meant only that the model ran.
# The upstream code-review plugin can end a run at its first step without a
# word: on a PR Claude has already commented on, or on a change it judges
# trivial. From 28 August to 16 September, 56 pushes across 27 PRs passed
# after a run that stopped within 70 seconds, 38 of them after the PR's first
# "No issues found". The review now comes from .claude/commands/ci-review.md,
# which the action reads from the default branch, reviews every head commit,
# and ends by posting a marker for that commit. "Confirm this commit's review
# was posted" looks for it.
#
# One secret is required, CLAUDE_CODE_OAUTH_TOKEN, generated locally with
# `claude setup-token` and pasted into Settings → Secrets and variables →
# Actions. With a Claude API key instead, swap the input below for
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`. The Claude GitHub App
# (github.com/apps/claude) must also be installed on the repository — that is
# the identity the review posts its inline comments as.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    # A draft is reviewed when it is marked ready, and the check shows as
    # skipped until then. The upstream plugin skipped drafts itself, and
    # passed; the repo's command does not look, so the job does.
    if: ${{ !github.event.pull_request.draft }}
    # One review per PR at a time, and it is for the newest push. A review of
    # a commit that has already been replaced costs as much as a real one and
    # reads a diff that has moved under it. The replaced run shows as
    # cancelled, not green.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Was twenty, on the argument that a slower review misses the merge window.
    # A real review of a large PR took eighteen minutes on 2026-09-03, which is
    # close enough to the cap to lose one to the clock — and a review killed
    # mid-run posts nothing at all, which is the failure this workflow exists
    # to prevent. The window is now however long the review takes, because the
    # PR waits for it.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Fail loudly, first, before anything else runs. A missing credential is
      # the one failure mode that used to be invisible.
      - name: Require the review credential
        env:
          REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$REVIEW_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN secret, so no review ran on this PR. Generate one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions. See docs/pr-review-process.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A re-run or a reopen of a commit that already has its review. The
      # review would cost the same again and post the same summary twice.
      #
      # GH_TOKEN stays on the steps that read. At job level it would reach the
      # action too, and gh prefers it over the token the action hands the
      # reviewer, so the summary comment would be refused.
      - name: Find this commit's review
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: claude[bot]
        run: |
          # Captured before `head`, so a failed API call fails the step
          # instead of reading as "no review yet".
          summaries=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == env.REVIEWER and (.body | contains("<!-- claude-review head=" + env.HEAD_SHA + " -->"))) | .html_url')
          url=$(printf '%s\n' "$summaries" | head -n 1)
          if [ -n "$url" ]; then
            echo "Commit $HEAD_SHA already has its review, so this run does not review it again: $url"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The one thing the reviewer needs from GitHub beyond the PR itself: the
      # inline comments already on it, so a finding is not posted twice. Read
      # here with the job's read-only token and handed over as a file — the
      # reviewer used to fetch them with `gh api`, which on the app's token
      # could just as well have written.
      - name: List the comments already on this PR
        if: steps.prior.outputs.url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .ci-review
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | {path, line: (.line // .original_line), author: .user.login, body}' \
            > .ci-review/inline-comments.jsonl
          echo "$(grep -c . .ci-review/inline-comments.jsonl || true) inline comments already on the PR"

      - id: claude
        if: steps.prior.outputs.url == ''
        uses: anthropics/claude-code-action@v1
        env:
          # The review skill runs itself as a background subagent. In a one-shot
          # SDK run there is nothing to come back to: the parent finishes its
          # turn — its last words on PR #29 were "I'll wait for the background
          # agent's completion notification rather than polling" — and the
          # process exits, taking the unfinished review with it. The run logged
          # subagent_stats {spawned: 1, completed: 0}, three turns and five
          # cents, and posted nothing. Every green review check before this one
          # meant that.
          #
          # This forces the review into the foreground so the run waits for it.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The command is this repo's copy of the code-review plugin's, minus
          # the step that skipped any PR Claude had commented on. The action
          # restores .claude/ from the default branch before it runs, so a PR
          # cannot rewrite the instructions it is reviewed by.
          #
          # --comment puts the findings on the PR as inline comments. Without
          # it they go to the run log, where nobody reads them. --head is the
          # commit the summary comment names, and the one the last step looks
          # for. --existing is the file the step above wrote, as an absolute
          # path because that is the only kind Read takes.
          prompt: "/ci-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --head ${{ github.event.pull_request.head.sha }} --existing ${{ github.workspace }}/.ci-review/inline-comments.jsonl"
          # --allowedTools is an ALLOWLIST: anything missing from it is denied,
          # and a denied tool in a non-interactive run is simply a dead turn.
          # Naming only the comment tool cost a run 39 turns, 39 denials and
          # $7.76 before it errored out — while still posting two findings, so
          # the check went red on a review that had actually worked
          # (2026-09-03). "Say which kind of red this is" names what was denied.
          #
          # Bash is listed command by command. The job's own GITHUB_TOKEN has
          # no write scope, but the action hands the reviewer the Claude app's
          # token — that is how `gh pr comment` posts the summary — and writes
          # the same token into the checkout's git remote. With plain `Bash`,
          # only the instructions stood between the reviewer and a push or a
          # merge. Now what it may run reads the PR and the code or posts its
          # one summary: no `git push`, no `gh pr merge`, no `gh api`. `cat`,
          # `grep` and the rest add no reach beyond Read and Grep; they are
          # here because subagents reach for them first. `git grep` and `rg`
          # are left out because each can start another program (`-O`,
          # `--pre`), and Grep does their job.
          #
          # `git fetch` and `echo` are here because #148's review was denied
          # both: the checkout is shallow, so without a fetch there is no base
          # commit to diff against, and `echo` appears in almost every
          # compound the reviewer writes — one denied part denies the whole
          # command. `npx`, `node` and `rm` were denied in that same run and
          # are deliberately still absent: each would hand arbitrary execution
          # to a run holding the app token, which is the one thing the list
          # above exists to prevent. The reviewer does not need to typecheck —
          # the `test` job does that, and its verdict is its own check.
          #
          # This stops a confused run, not one built to get around it: git's
          # own `-c` options can still start a program, and that program would
          # hold the app token too. PRs here come from the owner's sessions,
          # and a fork's PR gets no secrets at all.
          #
          # The comment tool stays first for a second reason: the action only
          # starts the inline-comment MCP server when it is named here.
          # Task and Agent are the same subagent tool under two names across
          # versions; an extra name in an allowlist costs nothing, a missing
          # one costs the review.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Task,Agent,TodoWrite,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *),Bash(gh pr list *),Bash(gh issue view *),Bash(gh issue list *),Bash(gh search *),Bash(git diff *),Bash(git fetch *),Bash(git log *),Bash(git show *),Bash(git blame *),Bash(git ls-files *),Bash(git status *),Bash(git rev-parse *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(ls *),Bash(grep *),Bash(echo *)"

      # The action can exit green without reviewing anything — it did exactly
      # that the first time this workflow ran. Its own success is therefore not
      # evidence that a review happened; the execution log it leaves behind is.
      # Without this step the silent-absence failure would simply have moved
      # from the connector into the workflow meant to replace it.
      - name: Confirm a review actually ran
        if: steps.prior.outputs.url == ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::error::The action exited without reviewing this PR, so nothing here has been reviewed. Expected when the PR changes this workflow file: the action refuses to run a version of itself that is not yet on the default branch, which is what stops a PR from rewriting its own reviewer. Otherwise read the step above for the reason."
            exit 1
          fi
          echo "Review ran, execution log at $EXECUTION_FILE"

      # The action's success says the model ran without an error. It does not
      # say anything was reviewed: from 2026-08-28 to 2026-09-16, 56 pushes
      # passed this check after the model stopped at the eligibility step and
      # posted nothing. The summary comment is the review's own record
      # that it finished, so this step looks for that record, on the PR, for
      # this exact commit.
      - name: Confirm this commit's review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: claude[bot]
        run: |
          summaries=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == env.REVIEWER and (.body | contains("<!-- claude-review head=" + env.HEAD_SHA + " -->"))) | .html_url')
          url=$(printf '%s\n' "$summaries" | head -n 1)
          if [ -n "$url" ]; then
            echo "Commit $HEAD_SHA was reviewed: $url"
            exit 0
          fi
          findings=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == env.REVIEWER and .original_commit_id == env.HEAD_SHA) | .id')
          inline=$(printf '%s' "$findings" | grep -c . || true)
          if [ "$inline" != "0" ]; then
            echo "::error::The review posted $inline inline comments on $HEAD_SHA but no summary, so it stopped before it finished. The comments are findings: read them, then re-run this job."
          else
            echo "::error::Nothing was posted for $HEAD_SHA: no summary comment and no inline comments. This commit has not been reviewed, whatever the step above reported. The next step shows how far the run got; re-run this job or review the diff by hand."
          fi
          exit 1

      # Runs even when the action failed, because a red check that does not say
      # WHICH red it is gets treated as noise. Two different failures produced
      # the same silent red on 2026-09-03: a tool allowlist so narrow the
      # reviewer spent every turn being denied, and a one-turn usage-limit
      # error straight after an expensive run. The first had posted findings
      # anyway; the second had posted nothing. Only the log could tell them
      # apart, and nobody reads the log of a check they assume is flaky.
      - name: Say which kind of red this is
        if: always() && steps.claude.outputs.execution_file != ''
        # Diagnostics must never be the reason a check is red — or green. This
        # step only explains the result the steps above already decided.
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ ! -s "$EXECUTION_FILE" ]; then
            echo "No execution log to read."
            exit 0
          fi
          summary=$(jq -s '[.[] | .. | objects | select(has("num_turns"))] | last // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          if [ -z "$summary" ]; then
            echo "The execution log has no result record — the run did not reach the end of a turn."
            exit 0
          fi
          turns=$(echo "$summary" | jq -r '.num_turns // "?"')
          # The file holds the SDK's raw result, where denials are an array.
          # A count field exists only in the summary the action prints, so
          # reading one here said 0 on every run, including the ones whose
          # printed summary said 1. Tool names only, and for Bash the program
          # and its subcommands: this log is public, and a denied call's input
          # can carry review text.
          #
          # One word was not enough to act on. Every run since 2026-09-16 has
          # reported twenty to thirty `Bash(gh)` denials, and `gh` is half
          # allowed — `gh pr diff` is on the allowlist and `gh api` is kept off
          # it deliberately, because the token the action hands the reviewer
          # can write. Which of the two the reviewer kept reaching for decides
          # whether there is anything to fix, and the log could not say.
          #
          # Up to three words, each a plain lowercase word ending at a space or
          # at the end of the command — the lookahead is what makes the second
          # part true, and without it `gh api repos/owner/repo/pulls/1` would
          # print its path's first segment. A flag, a path, a URL, a quoted
          # string or an `ENV=value` prefix all fail the test and end the name
          # where they start, so nothing from the diff or the review reaches
          # the log: that call prints as `Bash(gh api)`, `grep -n secret
          # src/x.ts` as `Bash(grep)`, and `NODE_ENV=1 npm test` as `Bash(?)`.
          # Anchored at the start, so a word that ran across a line break
          # cannot carry the next line with it.
          #
          # And every subcommand, not just the first. A Bash rule has to match
          # each part of a compound command on its own, so `gh pr diff 1 | sed
          # -n 1,200p` is refused over `sed` while `gh pr diff` is allowed —
          # and naming the first part alone reported seventeen denials of a
          # command that is on the allowlist, which read as the allowlist being
          # broken (2026-09-19). Split on the separators the permission system
          # recognises and name each part: `Bash(gh pr diff + sed)` says which
          # one to look at. The word filter runs per part, so a separator
          # inside a quoted string can only mislabel, never leak.
          denials=$(echo "$summary" | jq -r '.permission_denials // [] | length')
          denied=$(echo "$summary" | jq -r '
            def word: [match("^[a-z][a-z0-9._-]{0,30}(?=\\s|$)(?: [a-z][a-z0-9._-]{0,30}(?=\\s|$)){0,2}").string] | .[0] // "?";
            def name: [splits("\\s*(?:&&|\\|\\||\\|&|;|\\||&|\\n)\\s*")] | map(word) | .[0:4] | join(" + ");
            .permission_denials // []
            | map(if .tool_name == "Bash" then "Bash(" + ((.tool_input.command // "") | name) + ")" else (.tool_name // "?") end)
            | group_by(.) | map("\(.[0]) x\(length)") | join(", ")')
          failed=$(echo "$summary" | jq -r '.is_error // false')
          cost=$(echo "$summary" | jq -r '.total_cost_usd // 0')
          echo "turns=$turns denials=$denials is_error=$failed cost_usd=$cost"
          if [ -n "$denied" ]; then
            echo "Denied tools: $denied"
          fi
          # Denials are blamed only when they are a large share of the run.
          # Most healthy reviews have at least one (27 of 35 on 14–16 Sep), so
          # "any denial" would name the allowlist as the cause of most errors.
          #
          # Checked BEFORE the is_error exit below, and fatal rather than
          # advisory. A review denied most of its calls does not error — it
          # runs out of ways to look and writes what it can, which on #148 was
          # "No issues found" from a run denied `gh pr diff` itself: green,
          # posted, and hollow. That is worse than red, because red is read.
          # The denial arithmetic used to sit under an `exit 0` that a
          # successful run always took, so it had never once run on the case
          # it was written for (2026-09-20).
          if [ "$denials" -gt 0 ] && [ $((denials * 2)) -ge "${turns//[!0-9]/0}" ]; then
            echo "::error::The review was denied $denials tool calls in $turns turns, so it could not read what it was reviewing. Whatever it posted says nothing about this PR. This is a workflow problem: widen --allowedTools in .github/workflows/claude-review.yml, or narrow what the reviewer is asked to run."
            exit 1
          fi
          if [ "$failed" != "true" ]; then
            echo "The run ended without an error. Whether it reviewed this commit is the verdict of \"Confirm this commit's review was posted\", not of this step."
            exit 0
          fi
          if [ "$turns" = "1" ]; then
            echo "::warning::The review errored on its first turn with no tool denials, so the model never got going: upstream refused the request. That is a usage limit OR a provider incident, and the two look identical from here — check status.anthropic.com before concluding anything about budget. Either way this PR has NOT been reviewed; re-run the job."
          else
            echo "::warning::The review errored after $turns turns. Read the step log above for what it was doing."
          fi
